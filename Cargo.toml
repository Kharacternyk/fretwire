[package]
name = "fretwire"
version = "0.1.0"
edition = "2024"

[dependencies]
atomicwrites = "0.4.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
icu_casemap = "2.2.0"
icu_collator = "2.2.0"
icu_locale = "2.2.0"
icu_properties = "2.2.0"
writeable = "0.6.3"

[lints.clippy]
default_trait_access = { level = "allow", priority = 2 }
nursery = "warn"
pedantic = "warn"

[dev-dependencies]
arbtest = "0.3.2"
