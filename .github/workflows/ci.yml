name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: |
            clippy
            rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-nextest
            cargo-sort
            just

      - run: just check
